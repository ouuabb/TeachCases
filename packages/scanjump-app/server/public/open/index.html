<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ScanJump - 打开App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 60px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 30px;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .icon { font-size: 64px; margin-bottom: 20px; }
    .title { font-size: 22px; font-weight: bold; color: #333; margin-bottom: 12px; }
    .desc { font-size: 14px; color: #999; margin-bottom: 30px; line-height: 1.6; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 24px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.7; }
    .btn-primary { background: #2DC5A0; color: #fff; }
    .btn-secondary { background: #f0f0f0; color: #666; }
    .info { margin-top: 30px; padding: 16px; background: #f9f9f9; border-radius: 8px; width: 90%; max-width: 400px; }
    .info-title { font-size: 13px; color: #999; margin-bottom: 8px; }
    .info-item { font-size: 12px; color: #666; word-break: break-all; line-height: 1.8; }
    .status { margin-top: 16px; font-size: 13px; color: #2DC5A0; font-weight: bold; }
    .error { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📱</div>
    <div class="title">ScanJump</div>
    <div class="desc">
      正在尝试打开 ScanJump App...<br>
      如果 App 未安装，请点击下方按钮下载
    </div>
    <button class="btn btn-primary" id="openBtn" onclick="openApp()">打开 App</button>
    <button class="btn btn-secondary" id="downloadBtn" onclick="downloadApp()">下载 App</button>
    <div class="status" id="status"></div>
  </div>

  <div class="info">
    <div class="info-title">调试信息</div>
    <div class="info-item" id="debugInfo">解析中...</div>
  </div>

  <script>
    /**
     * H5 中转页核心逻辑
     *
     * 教学要点：
     * 1. 检测当前环境（App 内 / 微信 / 普通浏览器）
     * 2. 尝试 Scheme 唤起 App
     * 3. 判断 App 是否已安装
     * 4. 未安装时引导下载
     *
     * 完整链路：
     * 二维码 → H5中转页 → Scheme唤醒 → App打开
     *                        ↓ 未安装
     *                     下载页面
     */

    // 从 URL 参数中获取目标信息
    const urlParams = new URLSearchParams(window.location.search)
    const targetId = urlParams.get('id') || '123'
    const targetPage = urlParams.get('page') || 'detail'

    // 自定义 Scheme
    const SCHEME = 'scanjump'
    const SCHEME_URL = `${SCHEME}://${targetPage}?id=${targetId}`

    // App 下载地址（实际项目替换为真实地址）
    const DOWNLOAD_URL = '#'

    // 更新调试信息
    const debugEl = document.getElementById('debugInfo')
    debugEl.innerHTML = `
      目标页面: ${targetPage}<br>
      参数ID: ${targetId}<br>
      Scheme: ${SCHEME_URL}<br>
      UserAgent: ${navigator.userAgent.substring(0, 60)}...
    `

    /**
     * 环境检测
     * - 在 App 内（uni-app webview）：直接跳转
     * - 在微信：提示右上角浏览器打开
     * - 在普通浏览器：尝试 Scheme 唤起
     */
    function detectEnvironment() {
      const ua = navigator.userAgent.toLowerCase()
      return {
        isWechat: /micromessenger/i.test(ua),
        isApp: /uni-app|unipro/i.test(ua),
        isIOS: /iphone|ipad|ipod/i.test(ua),
        isAndroid: /android/i.test(ua)
      }
    }

    const env = detectEnvironment()

    /**
     * 尝试打开 App
     * 使用 iframe + location.href 双重尝试
     */
    function openApp() {
      const statusEl = document.getElementById('status')
      statusEl.className = 'status'
      statusEl.textContent = '正在尝试打开 App...'

      if (env.isWechat) {
        statusEl.className = 'status error'
        statusEl.textContent = '请使用浏览器打开（微信内无法直接唤起）'
        return
      }

      // 方法1：location.href（最常用）
      window.location.href = SCHEME_URL

      // 方法2：iframe 尝试（部分浏览器需要）
      const iframe = document.createElement('iframe')
      iframe.style.display = 'none'
      iframe.src = SCHEME_URL
      document.body.appendChild(iframe)

      // 3秒后检测是否唤起成功
      // 如果 App 已安装，页面会暂停（进入后台）
      // 如果未安装，页面继续执行
      setTimeout(() => {
        statusEl.className = 'status error'
        statusEl.textContent = '无法打开 App，请确认已安装'
        // 清理 iframe
        if (iframe.parentNode) {
          iframe.parentNode.removeChild(iframe)
        }
      }, 3000)
    }

    /**
     * 下载 App
     * 根据平台跳转到对应应用市场
     */
    function downloadApp() {
      if (env.isIOS) {
        // iOS: 跳转 App Store
        window.location.href = 'https://apps.apple.com/app/scanjump/id000000000'
      } else if (env.isAndroid) {
        // Android: 跳转应用市场或 APK 下载
        window.location.href = DOWNLOAD_URL
      } else {
        window.location.href = DOWNLOAD_URL
      }
    }

    // 自动尝试打开（页面加载后自动执行）
    // 注意：某些浏览器会拦截自动弹出，所以保留手动按钮
    window.addEventListener('load', () => {
      console.log('[H5中转页] 页面加载完成，环境检测:', env)
    })
  </script>
</body>
</html>
